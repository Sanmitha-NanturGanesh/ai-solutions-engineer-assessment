[project]
name = "fde-assessment"
version = "1.0.0"
description = "Forward Deployed Engineer assessment: MCP server, MCP security gateway, streaming PII guardrail, and resilient LLM router"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "pytest-asyncio>=0.24,<1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "task1_mcp_server*",
  "task2_mcp_gateway*",
  "task3_llm_guardrail*",
  "task4_model_router*",
]
exclude = ["tests*", "docs*"]
